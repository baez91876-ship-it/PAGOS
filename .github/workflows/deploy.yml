name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configurar redirección a Vercel
        env:
          VERCEL_URL: ${{ vars.VERCEL_URL }}
        run: |
          node --input-type=module -e "
            const url = new URL(process.env.VERCEL_URL);
            if (url.protocol !== 'https:' || url.username || url.password) {
              throw new Error('Configura la variable VERCEL_URL con la URL HTTPS pública de Vercel, sin credenciales.');
            }
          "
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.VERCEL_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
